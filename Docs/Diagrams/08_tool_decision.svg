   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'TH Sarabun New'; text-anchor: middle; fill: #2c1810" x="319.86" y="45.153656" transform="rotate(-0 319.86 45.153656)">ภาพที่ 8  การทำงานของระบบเลือกอุปกรณ์</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13.5px; font-family: 'TH Sarabun New'; text-anchor: middle; fill: #6b5b4b" x="319.86" y="64.494596" transform="rotate(-0 319.86 64.494596)">กลไกที่ใช้ซ้ำในทุก Core Part — เปลี่ยนคำถามจาก ทำอย่างไร เป็น ทำไมต้องใช้ของชิ้นนี้</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(275.435547 54.942939)">ผู้เล่นหยิบอุปกรณ์จากถาด</text>
    <text style="font-size: 13px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(278.112734 72.798642)">(สุ่มแสดง 6 จาก 10 ชิ้น)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(263.753828 119.166219)">ระบบเทียบคุณสมบัติของอุปกรณ์</text>
    <text style="font-size: 13px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(276.421719 134.061781)">กับสิ่งที่งานขั้นนั้นต้องการ</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(95.138031 188.612057)">เหมาะกับงาน</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(84.907563 202.122214)">ทำงานคืบหน้าเต็มที่</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(77.464203 218.266452)">ปิ๊บชมและอธิบายเหตุผล</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(290.985977 192.866598)">ใช้ได้แต่มีข้อจำกัด</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(290.60707 206.376755)">ช้ากว่าปกติ 2 เท่า</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(298.872695 216.98652)">หักคะแนน 3</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(511.57025 191.789255)">ห้ามใช้</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(496.814391 205.299411)">ปิ๊บคว้ามือไว้ทัน</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(486.078063 218.050192)">ยังไม่เกิดความเสียหาย</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'TH Sarabun New'; text-anchor: middle; fill: #6b5b4b" x="218.583" y="161.072212" transform="rotate(-0 218.583 161.072212)">เหมาะ</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'TH Sarabun New'; text-anchor: middle; fill: #6b5b4b" x="319.86" y="162.103462" transform="rotate(-0 319.86 162.103462)">พอใช้</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'TH Sarabun New'; text-anchor: middle; fill: #6b5b4b" x="421.137" y="162.103462" transform="rotate(-0 421.137 162.103462)">ห้ามใช้</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #ffffff" transform="translate(487.208922 272.138962)">เลือกชิ้นเดิมซ้ำอีกครั้ง</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #ffffff" transform="translate(488.140563 282.748728)">เกิดความเสียหายจริง</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #ffffff" transform="translate(482.464781 296.258884)">ต้องกลับไปทำขั้นนั้นใหม่</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'TH Sarabun New'; text-anchor: middle; fill: #2c1810" x="218.583" y="284.937791" transform="rotate(-0 218.583 284.937791)">ทำครบทุกขั้นย่อยของงานทำความสะอาด แล้วไปขั้นถัดไป</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(64.781875 350.826687)">การ์ดคุณสมบัติที่ผู้เล่นเห็นก่อนตัดสินใจ  —  ความแข็ง 0 ถึง 5   ความชื้น มี หรือ ไม่มี   ไฟฟ้าสถิต เสี่ยง หรือ ปลอดภัย   เศษตกค้าง   เข้าซอกแคบได้หรือไม่</text>
    <text style="font-size: 12.5px; font-family: 'TH Sarabun New'; fill: #2c1810" transform="translate(151.759414 367.995632)">ผู้เล่นที่อ่านการ์ดเป็นจะเลือกถูกแม้เจออุปกรณ์ที่ไม่เคยเห็นมาก่อน จึงเป็นการสอนวิธีคิด ไม่ใช่การท่องจำ</text>
   </g>
  </g>
